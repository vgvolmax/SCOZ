name: PR1 portable foundation
on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Optional JavaScript syntax check
        shell: powershell
        run: |
          if (Get-Command node -ErrorAction SilentlyContinue) {
            node --check frontend/assets/js/app.js
          } else {
            Write-Host "SKIP: optional Node syntax check is unavailable"
          }
      - name: Run full Windows portable smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\windows_smoke.ps1 -Mode Full
