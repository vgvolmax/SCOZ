name: CI
on:
  push:
  pull_request:
jobs:
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Verify Windows runtime lock graph
        shell: powershell
        run: |
          python -m venv .lock-venv
          .\.lock-venv\Scripts\python.exe -m pip install --only-binary=:all: --no-deps -r requirements.lock.txt
          .\.lock-venv\Scripts\python.exe -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify committed frontend
        run: git diff --exit-code -- frontend/dist
      - name: Full Windows portable smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\windows_smoke.ps1 -Mode Full
