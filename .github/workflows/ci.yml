name: PR1 portable foundation
on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: JavaScript syntax and frontend contracts
        shell: powershell
        run: |
          node --check frontend/assets/js/product_navigation.js
          node --check frontend/assets/js/app.js
          node --check frontend/assets/js/keystore.js
          node --check frontend/assets/js/import_ui.js
          node tests/product_navigation_contract.mjs
          node tests/competitor_state_contract.mjs
          node tests/keystore_contract.mjs
          node tests/import_ui_contract.mjs
      - name: Validate DESIGN.md
        shell: powershell
        run: npx --yes -p @google/design.md@0.4.0 designmd lint DESIGN.md
      - name: Run full Windows portable smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\windows_smoke.ps1 -Mode Full
