<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCOZ</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#products" aria-label="SCOZ — главная">SCOZ</a>
      <nav aria-label="Основная навигация">
        <button class="nav-item is-active" data-section="products" aria-current="page">Товары</button>
        <button class="nav-item" data-section="data">Данные</button>
        <button class="nav-item" data-section="settings">Настройки</button>
      </nav>
    </aside>
    <main class="content" tabindex="-1">
      <header class="page-header">
        <p class="eyebrow">Рабочее пространство</p>
        <h1 id="page-title">Товары</h1>
        <p id="page-description">Здесь появятся ваши товары после добавления данных.</p>
      </header>
      <section class="empty-state" aria-labelledby="empty-title">
        <div class="empty-icon" aria-hidden="true">□</div>
        <h2 id="empty-title">Пока нет данных</h2>
        <p id="empty-description">Начните работу в разделе «Данные». Содержимое появится здесь после настройки.</p>
      </section>
    </main>
  </div>
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
